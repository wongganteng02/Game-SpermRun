<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Wiring Diagram – Sperm Run (ESP8266)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">NodeMCU ESP8266 + OLED SSD1306 I2C + Buzzer + Tombol</text>

  <!-- NodeMCU -->
  <rect x="40" y="80" width="190" height="440" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">NodeMCU</text>
  <text x="135" y="132" text-anchor="middle" font-size="13" fill="#94a3b8">ESP8266 (ESP-12E)</text>
  <text x="135" y="500" text-anchor="middle" font-size="11" fill="#94a3b8">Power: USB Micro 5V</text>
  <g font-size="13" font-weight="600" fill="#fff" text-anchor="end">
    <text x="214" y="174">GND</text><text x="214" y="204">3V3</text>
    <text x="214" y="234">D1 (GPIO5)</text><text x="214" y="264">D2 (GPIO4)</text>
    <text x="214" y="334">D5 (GPIO14)</text><text x="214" y="364">GND</text>
    <text x="214" y="434">D6 (GPIO12)</text><text x="214" y="464">GND</text>
  </g>
  <g fill="#fbbf24" stroke="#0f172a">
    <circle cx="230" cy="170" r="5"/><circle cx="230" cy="200" r="5"/><circle cx="230" cy="230" r="5"/><circle cx="230" cy="260" r="5"/>
    <circle cx="230" cy="330" r="5"/><circle cx="230" cy="360" r="5"/>
    <circle cx="230" cy="430" r="5"/><circle cx="230" cy="460" r="5"/>
  </g>

  <!-- OLED -->
  <rect x="520" y="110" width="220" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="630" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">OLED SSD1306</text>
  <text x="630" y="154" text-anchor="middle" font-size="11" fill="#94a3b8">128x64 · I2C · alamat 0x3C</text>
  <g font-size="13" font-weight="600" fill="#fff">
    <text x="540" y="174">GND</text><text x="540" y="204">VCC</text><text x="540" y="234">SCL</text><text x="540" y="264">SDA</text>
  </g>
  <g fill="#fbbf24" stroke="#0f172a">
    <circle cx="520" cy="170" r="5"/><circle cx="520" cy="200" r="5"/><circle cx="520" cy="230" r="5"/><circle cx="520" cy="260" r="5"/>
  </g>

  <!-- Buzzer -->
  <rect x="520" y="310" width="220" height="80" rx="12" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <text x="685" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Buzzer</text>
  <text x="685" y="362" text-anchor="middle" font-size="11" fill="#ede9fe">pasif / aktif</text>
  <g font-size="13" font-weight="600" fill="#fff">
    <text x="540" y="334">+</text><text x="540" y="364">−</text>
  </g>
  <g fill="#fbbf24" stroke="#4c1d95"><circle cx="520" cy="330" r="5"/><circle cx="520" cy="360" r="5"/></g>

  <!-- Tombol -->
  <rect x="520" y="410" width="220" height="80" rx="12" fill="#0369a1" stroke="#0c4a6e" stroke-width="2"/>
  <text x="685" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Push Button</text>
  <text x="685" y="462" text-anchor="middle" font-size="11" fill="#e0f2fe">tombol FLAP</text>
  <g font-size="13" font-weight="600" fill="#fff">
    <text x="540" y="434">Kaki 1</text><text x="540" y="464">Kaki 2</text>
  </g>
  <g fill="#fbbf24" stroke="#0c4a6e"><circle cx="520" cy="430" r="5"/><circle cx="520" cy="460" r="5"/></g>

  <!-- Wires -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="170" x2="520" y2="170" stroke="#111827"/>
    <line x1="230" y1="200" x2="520" y2="200" stroke="#ef4444"/>
    <line x1="230" y1="230" x2="520" y2="230" stroke="#f59e0b"/>
    <line x1="230" y1="260" x2="520" y2="260" stroke="#22c55e"/>
    <line x1="230" y1="330" x2="520" y2="330" stroke="#a855f7"/>
    <line x1="230" y1="360" x2="520" y2="360" stroke="#111827"/>
    <line x1="230" y1="430" x2="520" y2="430" stroke="#3b82f6"/>
    <line x1="230" y1="460" x2="520" y2="460" stroke="#111827"/>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="375" y="163" fill="#111827">GND</text><text x="375" y="193" fill="#ef4444">3V3</text>
    <text x="375" y="223" fill="#b45309">SCL (D1)</text><text x="375" y="253" fill="#15803d">SDA (D2)</text>
    <text x="375" y="323" fill="#7e22ce">D5</text><text x="375" y="353" fill="#111827">GND</text>
    <text x="375" y="423" fill="#1d4ed8">D6</text><text x="375" y="453" fill="#111827">GND</text>
  </g>

  <line x1="40" y1="535" x2="920" y2="535" stroke="#e2e8f0"/>
  <text x="40" y="552" font-size="12" fill="#64748b">Tombol memakai INPUT_PULLUP (tanpa resistor): satu kaki ke D6, kaki lain ke GND. Kaki + buzzer ke D5.</text>
</svg>
